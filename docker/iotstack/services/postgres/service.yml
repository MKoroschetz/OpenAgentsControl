# Per-container service-section BACKUP for the postgres container.
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/services/postgres/service.yml
# Captured 2026-08-15 from dev IOTstack; UPDATED to target architecture C
# (postgres + pgagent combined image). This is the section to review and, once
# approved, to (re)enable in /mnt/db/IOTstack/docker-compose.yml.
#
# TARGET (postgres+pgagent combined, per docs/CORE-PLATFORM-UPGRADE.md §A.3/§A.4):
#   - ONE container runs PG 17 + the pgagent daemon (Dockerfile ../../postgres/Dockerfile)
#   - fresh host-persisted data dir volumes/postgres17/data (NOT the stale
#     volumes/postgres/data, and NOT an anonymous docker volume)
#   - dump/restore (globals -> postgres -> aspadb) into this dir BEFORE cutover;
#     side-by-side first on :5434, then flip to :5432
#
# During side-by-side migration, run the same image with ports "5434:5432" and
# container_name pg17; after validate/cutover, aspaDB takes over 5432.

  postgres:
    build:
      context: ./services/postgres/.
      dockerfile: Dockerfile
    image: aspadb-postgres:17         # combined postgres+pgagent image
    container_name: aspaDB
    restart: unless-stopped
    env_file:
      - ./services/postgres/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres17/data:/var/lib/postgresql/17/main
      - /mnt/db/IOTstack/DB_Backup:/mnt/DB-Backup
      - /var/run/postgresql:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s