  prkt-db:
    container_name: prkt-db
    build:
      context: ./services/prkt-db/.
      dockerfile: Dockerfile.v2.prkt-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - ./services/prkt-db/postgres.env
    volumes:
      # PGDATA mapping
      # Named volume mapped to host path for PGDATA
      - prkt-db_pgdata:/var/lib/postgresql/17/data         # 9/5/2025 latest 17.x minor from PGDG change to 17

      # Mount point to run custom scripts during installation - Disable when finished
      # - ./services/prkt-db/init:/docker-entrypoint-initdb.d/

      # Mount point for backups to be sent to different server Via FTP or similar service
      # - /mnt/data/prkt-db/DB-Backup:/mnt/DB-Backup

      # unix PG socket mapping. Needed to acces psql, pg_dump, pg_dumpall from host
      # - /var/run/postgresql:/var/run/postgresql
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    container_name: keycloak
    # command: start --optimized
    build:
      context: ./services/prkt-auth/.
      dockerfile: Keycloak.debian-slim
      # Keep the ENTRYPOINT in the Dockerfile, but use 'command' to pass flags
      # This appends these arguments to the end of your bin/kc.sh call
    command: ["--verbose"]
    environment:
      # Database configuration
      KC_DB: postgres
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: prkt-auth.Spargel.2025
      KC_DB_URL: jdbc:postgresql://prkt-db:5432/keycloak
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: prkt-auth.Spargel.2025
      # Server configuration
      # Tell Keycloak that it is being served via HTTPS by the proxy
      KC_HOSTNAME: https://vero.greentech.consulting:8090
      # Relax the strict hostname requirement for your setup
      KC_HOSTNAME_STRICT: false # Set to true for production
      # Allow HTTP for now (required if you haven't set up TLS yet)
      KC_HTTP_ENABLED: true
      # Tell Keycloak it's behind a proxy
      # KC_PROXY_MODE: edge   # deprecated in KC 26.5
      # Tell it which headers to trust
      KC_PROXY_HEADERS: xforwarded
      # *** Health API enpoints
      KC_ENABLE_HEALTH: "true"
      KC_ENABLE_METRICS: "true"
      # Explicitly set the management port to ensure it's not inherited
      KC_HTTP_MANAGEMENT_PORT: 9000
      KC_HTTP_MANAGEMENT_HOST: 0.0.0.0  # <--- This is the key
    networks:
      - keycloak-net
    ports:
      - "8090:8080"
      - "8091:9000"
    restart: always
    volumes:
      - kc-data:/opt/keycloak/data
    depends_on:
      prkt-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl -s -f -I http://keycloak:8080/realms/master/.well-known/openid-configuration"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s # Keycloak needs time to "re-augment" on first boot

secrets:
  kc_db_password:
    file: ./services/prkt-auth/kc_db_password.txt

volumes:
  # dedicated persistent volumes for prkt-auth / keycloak
  kc-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/prkt-auth/data
  # prkt-api dedicated /node_modules volume persistent in the container×¥
  prkt-api_modules:
  prkt-api_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/prkt-api
  # prkt-app dedicated /node_modules volume persistent in the container
  prkt-app_modules:
  prkt-app_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/quasar/prkt-app
  prkt-db_pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/prkt-db/data





