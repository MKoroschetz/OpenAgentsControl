# IOTstack compose stack - production services (aspa frontend manager / balancer, postgres17, apps).
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/docker-compose.yml
# **Version**: v4.0.0 | **Last Updated**: 2026-08-19 | **Author**: Manfred Koroschetz/AI
# **License**: SPDX-License-Identifier: MIT
#
# ## Changelog
# - v4.0.0 (2026-08-19): **PG17 migration cutover (A.9)** — postgres:12.13 service replaced by
#   postgres17 build (image `aspadb-postgres:17` = official postgres:17.11 + pgagent daemon);
#   container aspaDB→aspadb; env → services/postgres17/; PGDATA → volumes/postgres17/; backup
#   mount → /mnt/db/IOTstack/DB_Backup; healthcheck pg_isready -h localhost, start_period 20s.
#   Old postgres block kept commented for rollback (A.9/A.10, docs/CORE-PLATFORM-UPGRADE.md).
#   Standard header retrofit — legacy ## changelog lines superseded (history preserved below).
# - v3.1 (2024-02-05): migration to aspa v3.1 [legacy]
# - v3.0 (2023-03-10): migration to aspa v3 [legacy]
# - v1.0 (2022-02-07): production baseline (tested config) [legacy]

# adapted from production environment 172.20.61.220 - MK
# *** https://remote.kellerei-terlan.com:678 -> 172.20.61.220 ***
# Docker Network forced to 172.30.0.0/16
# in: /etc/docker/daemon.json
#     including:
#                  "default-address-pools" : [
#                    {
#                      "base" : "172.30.0.0/16",
#                      "size" : 24
#                    }
#                  ]
#####

networks:
  backend:
    driver: bridge
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

  frontend:
    driver: bridge
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.20.0/24
          gateway: 172.30.20.1

  keycloak-net:
    driver: bridge

services:

  portainer-ce:
    container_name: portainer-ce
    # image: portainer/portainer-ce:2.20.3  #** ok - 1/12/2024
    # image: portainer/portainer-ce:2.21.5   #** 0k - 1/27/2025
    # image: portainer/portainer-ce:2.27.1   #** 0k - 3/15/2025
    # image: portainer/portainer-ce:2.33.1   #** 0k - 9/1/2025 #
    image: portainer/portainer-ce:2.33.1-alpine   #** 0k - 9/1/2025 #
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/portainer-ce/data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  portainer_agent:
    # image: portainer/agent:latest
    # image: portainer/agent:2.27.1
    image: portainer/agent:2.33.1-alpine
    container_name: portainer_edge_agent
    restart: always
    environment:
    - EDGE=1
    - EDGE_ID=44e5355b-4c47-4527-8cad-9524b43d08bd
    - EDGE_KEY=aHR0cDovLzE5Mi4xNjguMTAwLjI4OjkwMDB8MTkyLjE2OC4xMDAuMjg6ODAwMHw2NTpiMjpkYTo3YTo0YTpjZDozNDowYjpmZDo5ZjpiNDpmZTpmZjo1NTo5Mzo4M3wxMA
    - EDGE_INSECURE_POLL=1
    ports:
    - 9001:9001
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /var/lib/docker/volumes:/var/lib/docker/volumes
    - ./volumes/portainer_agent/data:/data
    # healthcheck:
    #   test: ["CMD-SHELL", "nc -z localhost 9001 || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 5s

  aspaflows:    # modified format IOTstack
    container_name: aspaFLOWS
    build:
      context: ./services/aspaflows/.
      args:
      - DOCKERHUB_TAG=3.0.2
      # - EXTRA_PACKAGES=rsync cups cups-libs cups-client cups-filters
      network: host
    restart: unless-stopped
    user: "0:0"
    privileged: true
    env_file: ./services/aspaflows/nodered.env
    ports:
      - 1880:1880
    volumes:
      - /mnt/data/aspaflows/data:/data
        # Mapping to -> remote server
      - /mnt/data/aspadata/_aspaRemote/Lieferscheine:/mnt/Lieferscheine
      - /mnt/data/aspadata/_aspaRemote/Sortierbelege:/mnt/Sortierbelege
      - /mnt/data/aspadata/_aspaRemote/DB-Backup:/mnt/DB-Backup
        # Mapping to local aspa_api docs and DB backup folders
      - /mnt/data/aspadata/DB-Backup:/data/DB-Backup
      - /mnt/data/aspadata/aspaIngres/Lieferscheine:/data/Lieferscheine
      - /mnt/data/aspadata/aspaSort/Sortierbelege:/data/Sortierbelege
        # SSL certificate update mappings
      - /mnt/data/aspadata/_aspaRemote/SSL-Certificate:/mnt/SSL-Certificate
      - ./services/nginx/letsencrypt:/etc/letsencrypt
        # Mapping to -> Print queues
      - /mnt/data/aspastockapi/data/tmp:/data/toprint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspaflowsnew:    # modified format IOTstack
    container_name: aspaFLOWSnew
    build:
      context: ./services/aspaflows-400/.
      args:
        # NR_TAG: 4.0.2-18
        NR_TAG: 4.0.2-debian
        # NR_TAG: 3.1.8-18
      # - EXTRA_PACKAGES=rsync cups cups-libs cups-client cups-filters
      network: host
    restart: unless-stopped
    user: "0:0"
    privileged: true
    env_file: ./services/aspaflows-400/nodered.env
    ports:
      - 2880:1880
    volumes:
      - /mnt/data/aspaflows-400/data:/data
        # Mapping to -> remote server
      #- /mnt/data/aspadata/_aspaRemote/Lieferscheine:/mnt/Lieferscheine
      #- /mnt/data/aspadata/_aspaRemote/Sortierbelege:/mnt/Sortierbelege
      #- /mnt/data/aspadata/_aspaRemote/DB-Backup:/mnt/DB-Backup
        # Mapping to local aspa_api docs and DB backup folders
      #- /mnt/data/aspadata/DB-Backup:/data/DB-Backup
      #- /mnt/data/aspadata/aspaIngres/Lieferscheine:/data/Lieferscheine
      #- /mnt/data/aspadata/aspaSort/Sortierbelege:/data/Sortierbelege
        # SSL certificate update mappings
      - /mnt/data/aspadata/_aspaRemote/SSL-Certificate:/mnt/SSL-Certificate
      - ./services/nginx/letsencrypt:/etc/letsencrypt
        # Mapping to -> Print queues
      #- /mnt/data/aspastockapi/data/tmp:/data/toprint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspasort:    # modified format IOTstack
    container_name: aspaSORT
    build:
      context: ./services/aspasort/.
      args:
      - DOCKERHUB_TAG=3.0.2
    #  - EXTRA_PACKAGES=rsync cups cups-libs cups-client cups-filters
    restart: unless-stopped
    user: "0:0"
    privileged: true
    env_file: ./services/aspasort/nodered.env
    ports:
      - 1882:1880
    volumes:
      - /mnt/data/aspasort/data:/data
        # Mapping to -> remote server
      # - /mnt/data/aspadata/_aspaRemote/Lieferscheine:/mnt/Lieferscheine
      - /mnt/data/aspadata/_aspaRemote/Sortierbelege:/mnt/Sortierbelege
      # - /mnt/data/aspadata/_aspaRemote/DB-Backup:/mnt/DB-Backup
        # Mapping to local aspa_api docs and DB backup folders
      # - /mnt/data/aspadata/DB-Backup:/data/DB-Backup
      # - /mnt/data/aspadata/aspaIngres/Lieferscheine:/data/Lieferscheine
      - /mnt/data/aspadata/aspaSort/Sortierbelege:/data/Sortierbelege
        # SSL certificate update mappings
      - /mnt/data/aspadata/_aspaRemote/SSL-Certificate:/mnt/SSL-Certificate
      - ./services/nginx/letsencrypt:/etc/letsencrypt
        # Mapping to -> Print queues
      - /mnt/data/aspastockapi/data/tmp:/data/toprint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspaapi:
    container_name: aspaFLOWS_API
    build:
      context: ./services/aspaapi/.
      args:
      - DOCKERHUB_TAG=3.0.2
      - EXTRA_PACKAGES=
    restart: unless-stopped
    user: "0"
    privileged: true
    # links:
    #   - jasperreports:jasper   # Deprecated in modern Compose; service name resolution works automatically
    env_file: ./services/aspaapi/aspaapi.env
    ports:
      - 1881:1880
    volumes:
      - /mnt/data/aspaapi/data:/data
      - /mnt/data/aspadata/aspaIngres/Lieferscheine:/data/Lieferscheine
      - /mnt/data/aspadata/aspaSort/Sortierbelege:/data/Sortierbelege
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://aspaapi:1880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspaapi2:
    ## recovery only !!!
    container_name: aspaFLOWS_API2
    build:
      context: ./services/aspaapi2/.
      args:
      - DOCKERHUB_TAG=3.0.2
      - EXTRA_PACKAGES=

    restart: unless-stopped
    user: "0"
    privileged: true
    # links:
    #   - jasperreports:jasper   # Deprecated in modern Compose; service name resolution works automatically
    env_file: ./services/aspaapi2/aspaapi.env
    ports:
      - 1884:1880
    volumes:
      - /mnt/data/aspaapi2/data:/data
      #- /mnt/data/aspadata2/aspaIngres/Lieferscheine:/data/Lieferscheine
      #- /mnt/data/aspadata2/aspaSort/Sortierbelege:/data/Sortierbelege
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspaapp:  # new 5/1/2024
    container_name: aspa_APP
    image: 'registry.greentech.consulting/aspaapp-build-test:latest'
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      # Mapping to static folder to publish PDF and other source files
      - /mnt/data/aspaapp-prod/dist/spa/statics:/app/dist/spa/statics
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://aspaapp:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspastockapi:
    container_name: aspastockapi
    build:
      context: ./services/aspastockapi/.
      args:
      - DOCKERHUB_TAG=3.0.2
      - EXTRA_PACKAGES=
    restart: unless-stopped
    user: "0"
    privileged: true
    env_file: ./services/aspastockapi/aspastockapi.env
    ports:
      - 1889:1880
    volumes:
      - /mnt/data/aspastockapi/data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://aspastockapi:1880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspastock:
    container_name: aspaSTOCK
    # image: 'registry.greentech.consulting/aspastock-build-test:latest'
    image: 'registry.greentech.consulting/aspastock-build-test'
    restart: unless-stopped
    ports:
      - '8084:80'
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s

  aspasales:
    container_name: aspaSALES
    image: 'registry.greentech.consulting/aspasales-build-test:latest'
    restart: unless-stopped
    ports:
      - '8085:80'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspaauth:
    container_name: aspaAUTH
    image: 'node:latest'
    restart: unless-stopped
    user: "node"
    working_dir: /home/node/app
    env_file:
      - ./services/aspaauth/aspa_auth.env
    environment:
      - ISSUER=https://dev-50491138.okta.com/oauth2/default
    ports:
      - '3101:3101'
    volumes:
      - ./volumes/aspaauth:/home/node/app
    depends_on:
      aspaapi:
        condition: service_healthy
    command: "node ."
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:3101/ || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s

  aspa-login:
    container_name: aspa-login
    image: 'registry.greentech.consulting/aspalogin-build-test:latest'
    restart: unless-stopped
    ports:
      - "4010:80"
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s

  # aspabackendapi_prod_db:    # modified 3/21/2023 - ok 5/2/2024
  #   container_name: backendapi_prod_db
  #   image: "registry.greentech.consulting/backendapi"
  #   restart: unless-stopped
  #   user: "node"
  #   working_dir: /home/node/app
  #   env_file:
  #     - ./services/aspabackend/production.env
  #   environment:
  #     - NODE_ENV=production
