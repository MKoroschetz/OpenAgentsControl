  mosquitto:
    container_name: aspa_mqtt
    image: eclipse-mosquitto
    restart: unless-stopped
    #restart: "no"
    user: "1883"
    ports:
      - 1883:1883
      # - 9001:9001  ##Disabled for portainer agent conflict 1/12/2029 MK
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /mnt/data/mosquitto/data:/mosquitto/data
      - /mnt/data/mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

