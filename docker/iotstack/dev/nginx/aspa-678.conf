    location = /vouch-validate {
        # This address is where Vouch will be listening on
        #proxy_pass http://127.0.0.1:9090/validate;
        proxy_pass http://172.20.61.220/validate;
        #proxy_pass https://remote.kellerei-terlan.com:678/#/login;
        proxy_pass_request_body off; # no need to send the POST body

        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # these return values are passed to the @error401 call
        auth_request_set $auth_resp_jwt $upstream_http_x_vouch_jwt;
        auth_request_set $auth_resp_err $upstream_http_x_vouch_err;
        auth_request_set $auth_resp_failcount $upstream_http_x_vouch_failcount;
    }

    error_page 401 = @error401;
    error_page 403 = @error404;
    error_page 404 = @error401;

    # If the user is not logged in, redirect them to Vouch's login URL
    location @error401 {
        return 302 https://dev.greentech.consulting:678;
        # return 302 https://remote.kellerei-terlan.com:678/#/login;
    }
