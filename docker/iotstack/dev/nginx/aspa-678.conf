# aspa-678.conf - HTTPS listener (port 678), main app proxy (aspa_APP, aspaFLOWS_API, etc.).
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/dev/nginx/aspa-678.conf
# **Version**: v1.0.0 | **Last Updated**: 2026-08-19 | **Author**: Manfred Koroschetz/AI
# **License**: SPDX-License-Identifier: MIT
#
# ## Changelog
# - v1.0.0 (2026-08-19): Initial config - listen 678 ssl (http2), server_name
#   dev.greentech.consulting, letsencrypt certs, Vouch auth, proxies for app/API/CRM/stock.

include /etc/nginx/conf.d/blockuseragents.rules;

#include blockuseragens.rules;

server {
    if ($blockedagent) { return 403;}                                       # block unwanted user agents
    if ($request_method !~ ^(GET|HEAD|POST|PUT|OPTIONS)$) { return 444;}    # disallow other requests
    listen 678 ssl;
    http2 on;
    #server_name remote.kellerei-terlan.com;
    server_name dev.greentech.consulting;
    server_tokens off;

    ### ssl certificates ###
    #ssl_certificate /etc/letsencrypt/live/remote.kellerei-terlan.com/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/remote.kellerei-terlan.com/privkey.pem;   
    #ssl_certificate /etc/letsencrypt/live/remote.kellerei-terlan.com/remote.kellerei-terlan.com-chain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/remote.kellerei-terlan.com/remote.kellerei-terlan.com-key.pem;   

    ssl_certificate /etc/letsencrypt/live/greentech.consulting/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greentech.consulting/privkey.pem;   
    #ssl_trusted_certificate /etc/letsencrypt/live/greentech.consulting/chain.pem;

    # from Letsencrypt best practices
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL cert based authentication
    ## ssl_client_certificate /etc/nginx/client_certs/ca.crt;
    # make verification optional, so we can display a 403 message to those who fail authentication    
    ## ssl_verify_client optional;

    #access_log /var/log/nginx/aspa-678-ssl-access.log combined;
    access_log  /var/log/nginx/aspa-678-access.log;
    error_log   /var/log/nginx/aspa-678-error.log error;

    # If they come here using HTTP, bounce them to https
    error_page 497 https://$host:$server_port$request_uri;

    error_page 401 = @error401;
    error_page 404 = @error401;

    error_page 403 = /40x.html; # custom_error.html;
	
    # redirect server error pages to the static pages /40x.html /50x.html
    location = /40x.html { root   /app; }
    location = /50x.html { root   /app; }

    location / {
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header HOST $http_host;
                proxy_set_header X-NginX-Proxy true;
                proxy_pass http://aspa_APP:80;                   #aspa-APP quasar-base - on docker network
                #proxy_pass http://aspa_APP:4000/;                   #aspa-APP quasar-base - on docker network
                #proxy_pass http://aspaAPP:4000/;                   #aspa-APP quasar-base - on docker network
                proxy_redirect off;
    }
    location /aspaapi {
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header HOST $http_host;
                        proxy_set_header X-NginX-Proxy true;										
                        #proxy_pass http://aspa_api:1880;            #aspa_api node-red - on docker network
                        proxy_pass http://aspaFLOWS_API:1880;            #aspa_api node-red - on docker network
                        #proxy_redirect off;
                        access_log off;
    }

    # # working up to change of OKTA settings -02/2025
    # location /ipcheck {
    #                     proxy_set_header X-Real-IP $remote_addr;
    #                     proxy_set_header HOST $http_host;
    #                     proxy_set_header X-NginX-Proxy true;
    #                     # proxy_pass http://aspa_auth:3101;               # auth - on docker network
    #                     proxy_pass http://aspaAUTH:3101;                # uth - on container name                        
    #                     proxy_redirect off;
    #                     access_log off;
    # }

    # suggested change to prevent CORS errors:
    # This configuration adds the necessary CORS headers to allow cross-origin requests and handles preflight requests by returning a 204 status code12.
    location /ipcheck {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header HOST $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://aspaAUTH:3101;  # auth - on container name
        proxy_redirect off;
        access_log off;

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    location /login {
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header HOST $http_host;
                        proxy_set_header X-NginX-Proxy true;
                        proxy_pass http://aspa-login:80/login;            # aspa_APP - on docker network
                        # proxy_pass http://aspa_APP:4000/#/login;          # aspa_APP - on container name
                        access_log off;
    }

    location /aspastock {
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header HOST $http_host;
                        proxy_set_header X-NginX-Proxy true;
                        proxy_pass http://aspaSTOCK:80/aspastock;                # aspastock APP - on container name
                        proxy_redirect off;
                        access_log off;
    }
	
    location /aspasales {
