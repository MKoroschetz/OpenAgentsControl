# aspa-8081.conf - HTTP listener (host 80 → container 8081), redirects to HTTPS :678.
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/dev/nginx/aspa-8081.conf
# **Version**: v1.0.0 | **Last Updated**: 2026-08-19 | **Author**: Manfred Koroschetz/AI
# **License**: SPDX-License-Identifier: MIT
#
# ## Changelog
# - v1.0.0 (2026-08-19): Initial config - listen 8081 (matches compose 80:8081), ACME
#   challenge passthrough, redirects to https://dev.greentech.consulting:678.

include /etc/nginx/conf.d/blockuseragents.rules;

server {
    if ($blockedagent) { return 403; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 444; }

    listen 8081;  # ← CHANGED from 80 to 8081 (matches container port)
    server_name _;
    server_tokens off;

    # Error pages
    location = /40x.html { root /usr/share/nginx/html; }
    location = /50x.html { root /usr/share/nginx/html; }

    # Main redirect to HTTPS
    location / {
        access_log /var/log/nginx/aspa-80-access.log;
        error_log /var/log/nginx/aspa-80-error.log warn;
        return 301 https://dev.greentech.consulting:678$request_uri;
    }

    # Let's Encrypt ACME challenge (do NOT redirect this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Specific aspasales redirect
    location /aspasales {
        return 301 https://dev.greentech.consulting:678/aspasales;
    }
}

