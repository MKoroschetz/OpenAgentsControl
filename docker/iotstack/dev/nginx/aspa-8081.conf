# aspa-8081.conf - HTTP listener (host 80 → container 8081), redirects to HTTPS :678.
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/dev/nginx/aspa-8081.conf
# **Version**: v1.1.0 | **Last Updated**: 2026-08-19 | **Author**: Manfred Koroschetz/AI
# **License**: SPDX-License-Identifier: MIT
#
# ## Changelog
# - v1.1.0 (2026-08-19): Added ACME challenge access/error logging; dropped a
#   `listen 80;` that was added alongside it — dead in this container, since
#   compose maps host 80 → container 8081 only, so the existing 8081 listener
#   already receives ACME requests on the public port 80. Renewal is currently
#   manual (cert copied into the sync source); this location is scaffolding
#   for a future automated webroot flow, which will need a volume mount onto
#   /var/www/certbot in nginx.yml, not a port change here.
# - v1.0.0 (2026-08-19): Initial config - listen 8081 (matches compose 80:8081), ACME
#   challenge passthrough, redirects to https://dev.greentech.consulting:678.

server {
    if ($blockedagent) { return 403; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 444; }

    listen 8081;  # host 80 → container 8081 (compose `80:8081`); this is what
                  # actually receives ACME requests on the public port 80 too
    server_name _;
    server_tokens off;

    # Error pages
    location = /40x.html { root /usr/share/nginx/html; }
    location = /50x.html { root /usr/share/nginx/html; }

    # Main redirect to HTTPS
    location / {
        access_log /var/log/nginx/aspa-8081-access.log;
        error_log /var/log/nginx/aspa-8081-error.log warn;
        return 301 https://dev.greentech.consulting:678$request_uri;
    }

    # Let's Encrypt ACME challenge (do NOT redirect this). Renewal is currently
    # manual (cert copied into the sync source) — this location is scaffolding
    # for a future automated webroot flow. To activate: bind-mount the host
    # webroot certbot writes to onto /var/www/certbot in nginx.yml's volumes
    # (no listen/port change needed — host:80 already reaches this via the
    # compose `80:8081` mapping above).
    location /.well-known/acme-challenge/ {
        access_log /var/log/nginx/aspa-80-acme-challenge-access.log;
        error_log /var/log/nginx/aspa-80-acme-challenge-error.log warn;
        root /var/www/certbot;
    }

    # Specific aspasales redirect
    location /aspasales {
        return 301 https://dev.greentech.consulting:678/aspasales;
    }
}

