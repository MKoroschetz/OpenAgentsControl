# aspa-443.conf - HTTPS listener (port 443), greentech.consulting certs, redirect to :678.
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/dev/nginx/aspa-443.conf
# **Version**: v1.0.0 | **Last Updated**: 2026-08-19 | **Author**: Manfred Koroschetz/AI
# **License**: SPDX-License-Identifier: MIT
#
# ## Changelog
# - v1.0.0 (2026-08-19): Initial config - listen 443 ssl (http2), server_name
#   aspa.dev.greentech.consulting, letsencrypt certs, error_page 497 → :678.

include /etc/nginx/conf.d/blockuseragents.rules;
#include blockuseragents.rules;

server {
    if ($blockedagent) { return 403;}                           # block unwanted user agents
    #if ($request_method !~ ^(GET|HEAD|POST)$) { return 444;}    # disallow other requests

    listen 443 ssl;
    http2 on;
    #server_name remote.terlaner-spargel.com aspa.terlaner-spargel.com;
    #server_name dev.greentech.consulting aspa.dev.greentech.consulting;
    server_name aspa.dev.greentech.consulting;
    server_tokens off;

    ### ssl certificates ###
    #ssl_certificate /etc/letsencrypt/live/remote.kellerei-terlan.com/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/remote.kellerei-terlan.com/privkey.pem;   
    #ssl_certificate /etc/letsencrypt/live/remote.kellerei-terlan.com/remote.kellerei-terlan.com-chain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/remote.kellerei-terlan.com/remote.kellerei-terlan.com-key.pem;   
    ssl_certificate /etc/letsencrypt/live/greentech.consulting/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greentech.consulting/privkey.pem;   
    ssl_trusted_certificate /etc/letsencrypt/live/greentech.consulting/chain.pem;

    # from Letsencrypt best practices
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/aspa-443-access.log combined;

    # If they come here using HTTP, bounce them to https
    #error_page 497 https://$host:$server_port$request_uri;
    #error_page 497 https://remote.kellerei-terlan.com:678/;
    error_page 497 https://aspa.dev.greentech.consulting:678/;

    # redirect server error pages to the static pages /40x.html /50x.html
    location = /40x.html { root   /app; }
    location = /50x.html { root   /app; }

    location / {

                #*** NOTE: Teltonica RUT950 must hase special config for DNS resolution ***#
                # server name must resolve to local IP of server with same name as public DNS
                #
                # Configuration is done through SSH at the router prompt as follows:
                #
                # root@ap01:~# uci add dhcp domain
                # root@ap01:~# uci set dhcp.@domain[0].name="remote.kellerei-terlan.com"
                # root@ap01:~# uci set dhcp.@domain[0].ip="172.20.61.220"
                # root@ap01:~# uci commit dhcp
                # root@ap01:~# /etc/init.d/dnsmasq restart
                #
                # redirect to public URI "remote.kellerei-terlan.com" which must be 
                # resolved internally to 172.20.61.220 

                #return 301 https://remote.kellerei-terlan.com:678$request_uri;
                return 301 https://dev.greentech.consulting:678$request_uri;
    }
}