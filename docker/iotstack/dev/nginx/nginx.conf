# nginx.conf - main configuration for nginx:alpine (aspa frontend manager / balancer).
# **Project**: aspaDB-workbench | **Path**: docker/iotstack/dev/nginx/nginx.conf
# **Version**: v1.1.0 | **Last Updated**: 2026-08-19 | **Author**: Manfred Koroschetz/AI
# **License**: SPDX-License-Identifier: MIT
#
# ## Changelog
# - v1.1.0 (2026-08-19): Fixed two latent bugs found while diagnosing the post-migration
#   restart loop: `pid /var/run/nginx/nginx.pid;` referenced a subdirectory nginx never
#   creates (fixed to `/var/run/nginx.pid;`); moved `include
#   /etc/nginx/blockuseragents.rules;` here, once, instead of each aspa-*.conf including
#   it independently — conf.d/*.conf loads all site files into this same http context,
#   so multiple includes redeclared the `map $http_user_agent $blockedagent {...}` block
#   and nginx refused to start ("duplicate map variable"). See docs/NGINX-migration.md
#   v1.2.0 for the full diagnosis.
# - v1.0.0 (2026-08-19): Initial nginx:alpine main config - standard paths
#   (/var/log/nginx, /var/run/nginx), gzip/SSL tuning, conf.d includes.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 2;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Body size
    client_max_body_size 80M;
    
    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Shared user-agent blocklist (declared once here, not per-site — each
    # aspa-*.conf including it independently would duplicate the map block)
    include /etc/nginx/blockuseragents.rules;

    # Include site configurations
    include /etc/nginx/conf.d/*.conf;
}
